name: Deploy Airship to GitHub Pages

# Deployment is manual on purpose. Merging to `main` integrates source; it does
# not publish it.
#
# This workflow enforces only a few things: manual dispatch, a full 40-character
# commit SHA, proof that the SHA is already on `main`, and a recorded pointer to
# the release evidence for that exact commit.
#
# This file does not claim a second-person approval gate. Any extra release
# controls must come from repository settings or external process, not from a
# comment here.
#
# Automatic push or tag deployment stays disabled until the build is provably
# reproducible across clean checkouts.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Full 40-character commit SHA to deploy. A branch name is refused: a moving ref cannot be qualified."
        required: true
        type: string
      qualification:
        description: "Where the release evidence for this SHA lives (CI run URL, or the qualification issue). Recorded in the deployment log."
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      # `actions/deploy-pages` publishes from the `github-pages` environment.
      # The name here is functional, not an approval claim.
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse anything but an exact commit
        env:
          REF: ${{ inputs.ref }}
        run: |
          # A branch or tag can move between qualification and deployment. The
          # only ref that cannot is a full SHA, so it is the only one accepted.
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::'$REF' is not a full 40-character commit SHA. Deploy an exact commit, not a moving ref."
            exit 1
          fi

      - name: Checkout the exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Full history, so the ancestry check below can actually resolve
          # `origin/main`. A shallow checkout would make it unanswerable, and an
          # unanswerable safety check is worse than none: it looks like one.
          fetch-depth: 0

      - name: Refuse a commit that is not on main
        env:
          REF: ${{ inputs.ref }}
        run: |
          # A SHA is exact but not therefore reviewed. Without this, anyone who
          # can dispatch this workflow could deploy any commit that exists in
          # the repository — an abandoned branch, an unmerged experiment, a
          # reverted change — because they know its hash. Production deploys
          # what `main` has accepted.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$REF" origin/main; then
            echo "::error::$REF is not an ancestor of origin/main. Merge it before deploying it."
            exit 1
          fi
          echo "- Ancestry: \`$REF\` is on origin/main" >> "$GITHUB_STEP_SUMMARY"

      - name: Record what is being deployed
        env:
          # Every one of these reaches the shell as an environment variable, not
          # as template text spliced into the script. `qualification` is
          # free-form and operator-supplied; interpolating it directly would let
          # a backtick or `$(...)` in a URL execute here.
          REF: ${{ inputs.ref }}
          QUALIFICATION: ${{ inputs.qualification }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "## Deploying \`$REF\`"
            echo
            echo "- Release evidence: $QUALIFICATION"
            echo "- Requested by: $ACTOR"
          } >> "$GITHUB_STEP_SUMMARY"
          # Fail closed if the checkout is not the commit that was approved.
          test "$(git rev-parse HEAD)" = "$REF"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve the path this repository publishes at
        id: base
        env:
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Pages serves a project site from https://<owner>.github.io/<repo>/,
          # so the bundle has to be compiled against `/<repo>/`. This was written
          # as the literal `/airship/`, which is only correct while the
          # repository is named `airship`: a fork under any other name published
          # a bundle whose every URL pointed one directory above the site, and
          # the first thing a newcomer saw was a blank page and a wall of 404s.
          # A user or organisation site (`<owner>.github.io`) is served from the
          # origin root and takes `/` instead.
          name="${REPOSITORY#*/}"
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          if [ "$(lower "$name")" = "$(lower "$OWNER").github.io" ]; then
            base="/"
          else
            base="/$name/"
          fi
          echo "path=$base" >> "$GITHUB_OUTPUT"
          echo "- Base path: \`$base\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build static release
        env:
          AIRSHIP_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          # A Google OAuth *Web* client ID is a public deployment identifier, not
          # a secret, so it is a repository variable. Without it Vite strips the
          # entire Drive connect branch from the bundle and no runtime toggle can
          # restore it, so the default provider below must move with it.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Fail closed on an unconfigured deployment: start in explicit
          # page-memory mode rather than silently creating durable storage.
          VITE_AIRSHIP_DEFAULT_VAULT_PROVIDER: ${{ vars.VITE_GOOGLE_CLIENT_ID != '' && 'google-drive' || 'ephemeral' }}
        run: npm run build

      - name: Add and gate the static callback fallback
        run: |
          cp dist/index.html dist/404.html
          npm run check:release
          node --input-type=module -e 'import { readFile } from "node:fs/promises"; const manifest = JSON.parse(await readFile("dist/release-manifest.json", "utf8")); if (!manifest.artifacts.some((artifact) => artifact.path === "404.html")) process.exit(1);'

      - name: Install Chromium for the headerless-host security gate
        run: npx playwright install --with-deps chromium

      - name: Prove the Pages takeover and frame boundary
        env:
          # The gate must interrogate the artifact that was just built, at the
          # path it was built for. Reading the same resolved value keeps the
          # proof and the publication from testing two different URL spaces.
          AIRSHIP_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npx playwright test --config=playwright.static-host.config.ts

      - name: Record the deployed artifact inventory
        run: |
          # What actually shipped, in the log, so a deployed file can be checked
          # against the manifest that was reviewed. This is the honest half of a
          # build-integrity claim that cannot be made in full until the build is
          # deterministic across checkouts.
          find dist -type f -print0 | sort -z | xargs -0 shasum -a 256 > dist-checksums.txt
          {
            echo "### Deployed artifact"
            echo
            echo "- Files: $(wc -l < dist-checksums.txt)"
            echo "- Inventory digest: \`$(shasum -a 256 dist-checksums.txt | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact inventory
        uses: actions/upload-artifact@v4
        with:
          name: deployed-checksums-${{ inputs.ref }}
          path: dist-checksums.txt
          retention-days: 90

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
