name: Deploy Airship to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static release
        env:
          AIRSHIP_PUBLIC_BASE_PATH: /airship/
          VITE_AIRSHIP_CHUTES_PUBLIC_CLIENT_ID: ${{ vars.VITE_AIRSHIP_CHUTES_PUBLIC_CLIENT_ID }}
          VITE_AIRSHIP_PUBLIC_ORIGIN: ${{ vars.VITE_AIRSHIP_PUBLIC_ORIGIN }}
          # A Google OAuth *Web* client ID is a public deployment identifier, not
          # a secret, so it is a repository variable. Without it Vite strips the
          # entire Drive connect branch from the bundle and no runtime toggle can
          # restore it, so the default provider below must move with it.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Fail closed on an unconfigured deployment: default to the Local
          # Device vault, which needs no configuration, rather than offering a
          # Drive default this artifact cannot connect.
          VITE_AIRSHIP_DEFAULT_VAULT_PROVIDER: ${{ vars.VITE_GOOGLE_CLIENT_ID != '' && 'google-drive' || 'local-device' }}
        run: npm run build

      - name: Add static callback fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
