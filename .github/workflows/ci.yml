name: CI

# The evidence a merge is allowed to rest on.
#
# Until this existed, "green" meant one person's workstation. That is strong
# development evidence and it is not a release gate: the human-journey audit
# found the release budgets tuned to a chunk layout that only occurs in some
# checkouts, and a gate reading a gitignored file that no clone has. Both passed
# locally and neither could pass anywhere else. A clean runner is what makes the
# difference visible.
#
# Two gates, because the reviewed source SHA and the merge result answer
# different questions. `head` tests exactly what was reviewed. `integration`
# tests what `main` will actually contain, which is the merge of that branch with
# whatever `main` has become since. A branch can be green and still break on
# integration, and only the second gate can say so.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only, and no production secrets: this workflow runs on pull requests from
# any contributor and must not be able to publish, deploy, or reach a provider
# account. Deployment lives in `pages.yml` behind a protected environment.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The exact commit that was reviewed.
          - gate: head
            ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # What `main` will contain after the merge. GitHub's synthetic merge
          # ref; on a push to `main` this is the same commit as `head`, and the
          # duplicate run is cheap insurance against the two diverging.
          - gate: integration
            ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - name: Checkout ${{ matrix.gate }} (${{ matrix.ref }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          # Full history: the Atlas gate and `git diff --exit-code` need the real
          # tree, and a shallow checkout has bitten enough projects to be worth
          # the seconds.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Record the environment
        env:
          GATE: ${{ matrix.gate }}
        run: |
          # Every number this run produces is a number about a specific
          # environment. Saying which one is the difference between evidence and
          # an assertion.
          {
            echo "## $GATE gate"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$(git rev-parse HEAD)\` |"
            echo "| Node | $(node --version) |"
            echo "| npm | $(npm --version) |"
            echo "| OS | $(uname -srm) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies (clean)
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests, typecheck, security, references and release budgets
        run: npm run check

      - name: Journey Atlas verification
        run: |
          # The audit's control plane. It regenerates the derived documents into
          # memory and fails if they differ from what is committed, so a hand
          # edit shows up as a failure rather than as a claim.
          #
          # Guarded only while `main` predates the human-journey merge that
          # introduces it. The guard is fail-closed: a tracked findings source
          # with no gate to check it is an inconsistent tree, not a skip.
          if [ -f scripts/journey-atlas-gate.mjs ]; then
            node scripts/journey-atlas-gate.mjs --check
            echo "- Journey Atlas: verified" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f docs/audit/JOURNEY_FINDINGS.json ]; then
            echo "::error::docs/audit/JOURNEY_FINDINGS.json is present without scripts/journey-atlas-gate.mjs. The findings source has no gate."
            exit 1
          else
            echo "- Journey Atlas: not present on this base (introduced by the human-journey merge)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Working tree is clean after every gate
        run: |
          # Anything a gate generates must already be committed. This is what
          # stops a generated document drifting from its source between runs.
          if ! git diff --exit-code; then
            echo "::error::A gate modified tracked files. Commit the regenerated output."
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start the local S3 lab
        run: |
          # Several specs need the encrypted-Vault lab, and a runner without it
          # does not "skip" them — it fails them. The first run of this workflow
          # reported 10 desktop and 6 mobile failures that were entirely
          # `vault-auto-adoption`, `vault-provider-switch` and
          # `route-adversarial-audit` unable to reach MinIO on 127.0.0.1:9900.
          #
          # Provisioning it is the honest fix. Gating those specs on the lab's
          # absence would turn Airship's durability coverage into a pass made of
          # skips, which is the one shape of green worth less than a red.
          npm run lab:start
          npm run lab:status

      - name: Lab must actually be up
        run: |
          # Fail here rather than 40 minutes later inside the browser matrix,
          # where the same absence reads as a Vault regression.
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:9900/minio/health/live
          echo "- Local S3 lab: healthy" >> "$GITHUB_STEP_SUMMARY"

      - name: Discover the suite
        run: |
          # An expected count the execution cannot influence. Taken BEFORE the
          # run, from a separate pass, because the previous version of this gate
          # summed the execution report's own numbers and compared them to
          # nothing — so a run that executed 127 of 184 tests agreed with itself
          # and passed.
          npx playwright test --list --project=desktop-chromium --reporter=json > desktop-list.json
          npx playwright test --list --project=mobile-chromium --reporter=json > mobile-list.json

      - name: Browser matrix
        run: |
          set +e
          npx playwright test --project=desktop-chromium --reporter=json > desktop.json 2>desktop.err
          desktop=$?
          npx playwright test --project=mobile-chromium --reporter=json > mobile.json 2>mobile.err
          mobile=$?
          set -e
          echo "DESKTOP_EXIT=$desktop" >> "$GITHUB_ENV"
          echo "MOBILE_EXIT=$mobile" >> "$GITHUB_ENV"
          # The cardinality gate below is the one that decides, so a reporter
          # that dies mid-run cannot be read as a pass.
          exit 0

      - name: Browser cardinality and outcomes
        run: |
          # `scripts/browser-cardinality.test.mjs` holds this gate to every case
          # it must refuse, including the 127-of-184 run that made it necessary.
          node scripts/browser-cardinality.mjs \
            "desktop-chromium:desktop-list.json:desktop.json:$DESKTOP_EXIT" \
            "mobile-chromium:mobile-list.json:mobile.json:$MOBILE_EXIT"

      - name: Stop the local S3 lab
        if: always()
        run: docker compose -f compose.local-lab.yaml down --volumes || true

      - name: Artifact inventory and checksums
        if: always()
        run: |
          if [ -d dist ]; then
            find dist -type f -print0 | sort -z | xargs -0 shasum -a 256 > artifact-checksums.txt
            {
              echo "### Artifacts"
              echo
              echo "- Files: $(wc -l < artifact-checksums.txt)"
              echo "- Inventory digest: \`$(shasum -a 256 artifact-checksums.txt | cut -d' ' -f1)\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          [ -f dist/release-manifest.json ] && cp dist/release-manifest.json . || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ matrix.gate }}-${{ github.run_id }}
          path: |
            desktop-list.json
            mobile-list.json
            desktop.json
            mobile.json
            desktop.err
            mobile.err
            playwright-report/
            test-results/
            artifact-checksums.txt
            release-manifest.json
          if-no-files-found: warn
          retention-days: 30
