name: CI

# The evidence a merge is allowed to rest on.
#
# Until this existed, "green" meant one person's workstation. That is strong
# development evidence and it is not a release gate: the human-journey audit
# found the release budgets tuned to a chunk layout that only occurs in some
# checkouts, and a gate reading a gitignored file that no clone has. Both passed
# locally and neither could pass anywhere else. A clean runner is what makes the
# difference visible.
#
# Two gates, because the reviewed source SHA and the merge result answer
# different questions. `head` tests exactly what was reviewed. `integration`
# tests what `main` will actually contain, which is the merge of that branch with
# whatever `main` has become since. A branch can be green and still break on
# integration, and only the second gate can say so.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only, and no production secrets: this workflow runs on pull requests from
# any contributor and must not be able to publish, deploy, or reach a provider
# account. Deployment lives in `pages.yml` behind a protected environment.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The exact commit that was reviewed.
          - gate: head
            ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # What `main` will contain after the merge.
          #
          # Not `merge_commit_sha`: that is the merge GitHub had already computed
          # when the event fired, and it goes stale as soon as another commit
          # lands on the branch. Run 30783741516 tested a merge whose branch
          # parent was the *previous* head, so the gate certified a tree that did
          # not contain the change under review — an integration gate reporting on
          # something other than the integration. `refs/pull/N/merge` is the ref
          # GitHub recomputes, and the certification step below proves which
          # branch commit actually went in.
          - gate: integration
            ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
    steps:
      - name: Checkout ${{ matrix.gate }} (${{ matrix.ref }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          # Full history: the Atlas gate and `git diff --exit-code` need the real
          # tree, and a shallow checkout has bitten enough projects to be worth
          # the seconds.
          fetch-depth: 0

      - name: Check out the gate's own tooling
        uses: actions/checkout@v4
        with:
          # The measuring instrument must not come from the tree being measured.
          # A reviewed head can predate the tooling — PR #2's head does — and run
          # 30783741516 died with
          # `Cannot find module .../scripts/browser-cardinality.mjs` for exactly
          # that reason. A gate that cannot run against an older tree cannot
          # measure it, and a gate that silently does not run is the failure this
          # workflow exists to prevent.
          #
          # Must follow the checkout above: that one cleans the workspace root.
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          fetch-depth: 1

      - name: Lift the gate clear of the measured tree
        run: |
          # …and then get it out of the workspace immediately.
          #
          # `npm test` excludes `.airship-lab`, `e2e` and `references`, but Vitest's
          # default include still globs `**/*.test.ts` — so a second checkout left
          # sitting in the workspace is collected as source. It has no
          # `node_modules`, so `npm run check` fails on unresolvable imports; worse,
          # were it installed it would double every count this workflow reports.
          # Verified by probe: a throwaway `*.test.ts` under a sibling directory is
          # picked up by the project's own test command.
          #
          # The gate imports nothing but `node:` builtins, so one file is the whole
          # instrument. Copy it somewhere the measured tree cannot see and delete
          # the rest.
          cp .ci-tools/scripts/browser-cardinality.mjs "$RUNNER_TEMP/browser-cardinality.mjs"
          rm -rf .ci-tools
          echo "- Cardinality gate staged from \`${{ github.workflow_sha }}\`, outside the measured tree" >> "$GITHUB_STEP_SUMMARY"

      - name: Certify what is being measured
        env:
          GATE: ${{ matrix.gate }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The cardinality gate exists because a run summed its own numbers and
          # agreed with itself. This is that same failure one level up: a run
          # agreeing that it tested whatever it happened to check out. Every
          # number below is a number about this commit, so the commit is stated
          # and reconciled before any of them are produced.
          MEASURED_SHA="$(git rev-parse HEAD)"
          echo "$MEASURED_SHA" > measured-sha.txt

          if [ -z "$REVIEWED_SHA" ]; then
            echo "- Measured \`$MEASURED_SHA\` (push build; no pull request to reconcile against)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$GATE" = "head" ]; then
            if [ "$MEASURED_SHA" != "$REVIEWED_SHA" ]; then
              echo "::error::The head gate checked out $MEASURED_SHA, but the reviewed commit is $REVIEWED_SHA."
              exit 1
            fi
            echo "- Measured \`$MEASURED_SHA\`, which is the reviewed commit" >> "$GITHUB_STEP_SUMMARY"
          else
            # A merge ref's second parent is the branch being merged in. If that
            # is not the reviewed commit, this run is certifying a merge of
            # something else, which is precisely how run 30783741516 passed
            # judgement on a tree nobody had reviewed.
            MERGED_HEAD="$(git rev-parse 'HEAD^2')"
            if [ "$MERGED_HEAD" != "$REVIEWED_SHA" ]; then
              echo "::error::The integration gate merged $MERGED_HEAD, but the reviewed commit is $REVIEWED_SHA. The merge ref is stale; re-run once GitHub has recomputed it."
              exit 1
            fi
            echo "- Measured merge \`$MEASURED_SHA\`, whose branch parent is the reviewed commit \`$REVIEWED_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Record the environment
        env:
          GATE: ${{ matrix.gate }}
        run: |
          # Every number this run produces is a number about a specific
          # environment. Saying which one is the difference between evidence and
          # an assertion.
          {
            echo "## $GATE gate"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$(git rev-parse HEAD)\` |"
            echo "| Node | $(node --version) |"
            echo "| npm | $(npm --version) |"
            echo "| OS | $(uname -srm) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies (clean)
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright browsers
        # Ahead of `npm run check`, not after it: `check` now ends with
        # `check:browser`, the two geometry specs that are cheap enough to be a
        # precondition for a green local run. Leaving the install where it used
        # to sit would make the gate fail on a missing executable rather than on
        # the product.
        run: npx playwright install --with-deps chromium

      - name: Unit tests, typecheck, security, references, release budgets and phone geometry
        run: npm run check

      - name: Journey Atlas verification
        run: |
          # The audit's control plane. It regenerates the derived documents into
          # memory and fails if they differ from what is committed, so a hand
          # edit shows up as a failure rather than as a claim.
          #
          # Guarded only while `main` predates the human-journey merge that
          # introduces it. The guard is fail-closed: a tracked findings source
          # with no gate to check it is an inconsistent tree, not a skip.
          if [ -f scripts/journey-atlas-gate.mjs ]; then
            node scripts/journey-atlas-gate.mjs --check
            echo "- Journey Atlas: verified" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f docs/audit/JOURNEY_FINDINGS.json ]; then
            echo "::error::docs/audit/JOURNEY_FINDINGS.json is present without scripts/journey-atlas-gate.mjs. The findings source has no gate."
            exit 1
          else
            echo "- Journey Atlas: not present on this base (introduced by the human-journey merge)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Working tree is clean after every gate
        run: |
          # Anything a gate generates must already be committed. This is what
          # stops a generated document drifting from its source between runs.
          if ! git diff --exit-code; then
            echo "::error::A gate modified tracked files. Commit the regenerated output."
            exit 1
          fi

      - name: Start the local S3 lab storage plane
        run: |
          # Several specs need the encrypted-Vault lab, and a runner without it
          # does not "skip" them — it fails them. The first run of this workflow
          # reported 10 desktop and 6 mobile failures that were entirely
          # `vault-auto-adoption`, `vault-provider-switch` and
          # `route-adversarial-audit` unable to reach MinIO on 127.0.0.1:9900.
          #
          # Provisioning it is the honest fix. Gating those specs on the lab's
          # absence would turn Airship's durability coverage into a pass made of
          # skips, which is the one shape of green worth less than a red.
          #
          # Storage only, deliberately. `lab:start` also starts a lab-owned Vite,
          # and `labEnvironment()` always sets `VITE_GOOGLE_CLIENT_ID`. Because
          # `playwright.config.ts` reuses an existing server on 4173, that
          # lab-owned Vite became the matrix's server and synthesised a Google
          # registration the matrix documents it must not have — so
          # `vault-provider-switch`, which asserts that a provider that cannot be
          # opened cannot be chosen, failed on a premise this workflow had broken.
          # A one-variable check is decisive: with the lab's client ID the spec
          # fails 3/3, without it the spec passes 3/3, storage identical. The
          # matrix owns its own server so the run measures the product rather than
          # the harness.
          npm run lab:storage

      - name: Lab must actually be up
        run: |
          # Fail here rather than 40 minutes later inside the browser matrix,
          # where the same absence reads as a Vault regression.
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:9900/minio/health/live
          echo "- Local S3 lab: healthy" >> "$GITHUB_STEP_SUMMARY"

      - name: Discover the suite
        run: |
          # An expected count the execution cannot influence. Taken BEFORE the
          # run, from a separate pass, because the previous version of this gate
          # summed the execution report's own numbers and compared them to
          # nothing — so a run that executed 127 of 184 tests agreed with itself
          # and passed.
          npx playwright test --list --project=desktop-chromium --reporter=json > desktop-list.json
          npx playwright test --list --project=mobile-chromium --reporter=json > mobile-list.json

      - name: Browser matrix
        run: |
          set +e
          npx playwright test --project=desktop-chromium --reporter=json > desktop.json 2>desktop.err
          desktop=$?
          npx playwright test --project=mobile-chromium --reporter=json > mobile.json 2>mobile.err
          mobile=$?
          set -e
          echo "DESKTOP_EXIT=$desktop" >> "$GITHUB_ENV"
          echo "MOBILE_EXIT=$mobile" >> "$GITHUB_ENV"
          # The cardinality gate below is the one that decides, so a reporter
          # that dies mid-run cannot be read as a pass.
          exit 0

      - name: Browser cardinality and outcomes
        run: |
          # `scripts/browser-cardinality.test.mjs` holds this gate to every case
          # it must refuse, including the 127-of-184 run that made it necessary.
          #
          # Run from the staged copy of the workflow's own checkout, so that a
          # reviewed tree predating this script is still measurable rather than
          # unmeasured.
          node "$RUNNER_TEMP/browser-cardinality.mjs" \
            "desktop-chromium:desktop-list.json:desktop.json:$DESKTOP_EXIT" \
            "mobile-chromium:mobile-list.json:mobile.json:$MOBILE_EXIT"

      - name: Stop the local S3 lab
        if: always()
        # `--project-name` must match the one `local-lab.mjs` starts it under, or
        # this stops nothing and reports success for having done so.
        run: docker compose --project-name airship-local-lab --file compose.local-lab.yaml down --volumes || true

      - name: Artifact inventory and checksums
        if: always()
        run: |
          if [ -d dist ]; then
            find dist -type f -print0 | sort -z | xargs -0 shasum -a 256 > artifact-checksums.txt
            {
              echo "### Artifacts"
              echo
              echo "- Files: $(wc -l < artifact-checksums.txt)"
              echo "- Inventory digest: \`$(shasum -a 256 artifact-checksums.txt | cut -d' ' -f1)\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          [ -f dist/release-manifest.json ] && cp dist/release-manifest.json . || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ matrix.gate }}-${{ github.run_id }}
          path: |
            measured-sha.txt
            desktop-list.json
            mobile-list.json
            desktop.json
            mobile.json
            desktop.err
            mobile.err
            playwright-report/
            test-results/
            artifact-checksums.txt
            release-manifest.json
          if-no-files-found: warn
          retention-days: 30
