<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The pre-script defaults only. Static HTML cannot read a stored display
         preference, so it must not assert one: `applyPreferenceOverrides` in
         src/main.tsx rewrites `theme-color` from the resolved `--ground` and
         puts the real `color-scheme` on `<html>` before the first render, and
         `light dark` leaves the one frame before that to the reader's OS
         rather than painting a dark canvas around a paper document. -->
    <meta name="theme-color" content="#101417" />
    <meta name="color-scheme" content="light dark" />
    <!-- WebContainer's hidden StackBlitz frame needs the embedding origin to
         establish its page-local runtime channel. Paths and queries stay private. -->
    <meta name="referrer" content="origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; form-action 'none'; frame-src https://stackblitz.com https://accounts.google.com; object-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://logos.chutes.ai; connect-src 'self' https://api.chutes.ai https://llm.chutes.ai https://chutes-qwen-qwen3-embedding-8b-tee.chutes.ai https://auth.openai.com https://api.openai.com https://api.anthropic.com https://api.x.ai http://localhost:11434 http://127.0.0.1:11434 http://localhost:11435 http://127.0.0.1:11435 http://localhost:11436 http://127.0.0.1:11436 http://localhost:1234 http://127.0.0.1:1234 http://localhost:1235 http://127.0.0.1:1235 http://localhost:1236 http://127.0.0.1:1236 https://api.github.com https://raw.githubusercontent.com https://api.shelbynet.shelby.xyz https://pccs.phala.network https://registry.wasmer.io https://cdn.wasmer.io https://accounts.google.com https://www.googleapis.com https://openidconnect.googleapis.com; worker-src 'self' blob:; manifest-src 'self'; font-src 'self'; trusted-types default airship-static airship-worker airship-semantic-worker airship-wasix-worker airship-wasi-preview1-worker airship-opfs-worker airship-google-identity; require-trusted-types-for 'script'"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <title>Airship — private edge agent</title>
    <meta
      name="description"
      content="A private, local-first agent runtime with verifiable confidential inference."
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
