[package]
name = "airship-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Pure deterministic state machine for bounded Airship agent turns"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

